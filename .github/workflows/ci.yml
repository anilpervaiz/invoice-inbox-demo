name: CI

on:
  push:
    branches: ["main", "showcase"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run unit and integration tests
        run: npm test

      - name: Run release integrity check
        run: npm run check:release

      - name: Build production bundle
        run: npm run build
